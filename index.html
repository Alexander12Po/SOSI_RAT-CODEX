<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOSI CODEX — Panel de servicios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css?v=6">
    <link rel="stylesheet" href="assets/css/layout.css?v=6">
    <link rel="stylesheet" href="assets/css/loader.css?v=6">
    <link rel="stylesheet" href="assets/css/home.css?v=6">
</head>
<body>

    <!-- LOADER -->
    <div class="loader-screen" id="loaderScreen">
        <div class="loader-content">
            <div class="loader-logo">SC</div>
            <h2 class="loader-title">SOSI CODEX</h2>
            <div class="loader-bar"><div class="loader-bar-fill"></div></div>
            <p class="loader-sub">Conectando…</p>
        </div>
    </div>

    <!-- SIDEBAR (se genera desde services.js) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">
                <span class="brand-mark">SC</span>
                <span class="sidebar-brand">SOSI<small>Codex</small></span>
            </a>
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Cerrar menú">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <div class="security-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                <span>Cifrado AES</span>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <span class="topbar-title">SOSI Codex</span>
            </div>
            <div class="topbar-right">
                <div class="status-indicator"><span class="status-dot"></span><span>En línea</span></div>
                <a href="consulta.html" class="user-avatar" aria-label="Consulta DNI">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </a>
            </div>
        </header>

        <div class="page-content">

            <!-- Encabezado compacto -->
            <div class="panel-head">
                <div class="ph-left">
                    <div class="ph-badge">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                    </div>
                    <div>
                        <div class="ph-title">Servicios</div>
                        <div class="ph-sub">Reniec · Data verificada</div>
                    </div>
                </div>
                <span class="ph-count" id="svcCount"></span>
            </div>

            <!-- Búsqueda funcional -->
            <div class="finder">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="svcSearch" placeholder="Buscar servicios..." autocomplete="off" aria-label="Buscar servicios">
                <button class="finder-clear" id="svcClear" aria-label="Limpiar">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Filtros por categoría -->
            <div class="chip-row" id="chipRow"></div>

            <!-- Cuadrícula de tarjetas (2 columnas en móvil) -->
            <section id="servicios">
                <div id="servicesGrid"></div>
            </section>

        </div>

        <footer class="footer">
            <span>© 2026 SOSI CODEX</span>
            <span class="text-accent">v6 · panel</span>
        </footer>
    </main>

    <script src="assets/js/config.js?v=6"></script>
    <script src="assets/js/icons.js?v=6"></script>
    <script src="assets/js/services.js?v=6"></script>
    <script src="assets/js/loader.js?v=6"></script>
    <script src="assets/js/sidebar.js?v=6"></script>
    <script src="assets/js/pages/home.js?v=6"></script>
</body>
</html>
