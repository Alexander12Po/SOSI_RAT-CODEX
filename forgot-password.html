<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — SOSI CODEX</title>
    <meta name="description" content="Restablece tu contraseña de SOSI CODEX.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css?v=17">
    <link rel="stylesheet" href="assets/css/auth.css?v=17">
</head>
<body class="auth-body">

<main class="auth-shell">
    <form class="auth-card" id="forgotForm" novalidate>
        <div class="auth-brand">
            <span class="auth-logo"><img src="assets/img/favicon.png" alt="Logo SOSI CODEX"></span>
        </div>
        <h1 class="auth-title">Recuperar contraseña</h1>
        <p class="auth-sub">Te enviaremos un enlace seguro a tu correo</p>

        <div class="auth-field">
            <label class="auth-label" for="email">Correo electrónico</label>
            <input class="auth-input" type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required>
        </div>

        <div class="auth-err" id="forgotErr" role="alert"></div>
        <div class="auth-ok-msg" id="forgotOk" role="status"></div>

        <button class="auth-btn auth-btn-primary" type="submit" id="forgotBtn">
            <span class="auth-spin"></span>
            <span class="auth-btn-label">Enviar enlace</span>
        </button>

        <p class="auth-foot"><a class="auth-link" href="login.html">← Volver a iniciar sesión</a></p>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js?v=17"></script>
<script src="assets/js/env.js?v=17"></script>
<script src="assets/js/auth.js?v=17"></script>
<script src="assets/js/pages/forgot.js?v=17"></script>
</body>
</html>
