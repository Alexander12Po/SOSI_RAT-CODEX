</div>

<aside class="sidebar" id="sidebar">

      <span class="brand-mark">SC</span>
      <span class="sidebar-brand">SOSI<small>Codex</small></span>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menú">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <span class="nav-section">General</span>
    <a href="index.html" class="nav-item">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

    <a href="consulta.html" class="nav-item active">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg>
      <span>Consulta DNI</span>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>

<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <span class="topbar-title">Consulta DNI</span>
    </div>
    <div class="topbar-right">
      <div class="status-indicator"><span class="status-dot"></span>En línea</div>
    </div>
  </header>

  <div class="page-content">
    <div class="consulta-wrap">

      <!-- Búsqueda compacta en una sola barra -->
      <div class="search-panel">
        <div class="sp-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg>
        </div>
        <div class="sp-meta">
          <b>Consulta DNI</b>
          <span>8 dígitos · RENIEC</span>
        </div>
        <div class="input-group">
          <input type="text" id="dni" placeholder="12345678" maxlength="8" inputmode="numeric" autocomplete="off" aria-label="Número de DNI">
          <button id="btnConsultar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        </div>
      </div>

      <!-- Resultados -->
      <section id="resultsSection" style="display:none">
        <div class="results-grid" id="resultsContainer"></div>
      </section>

    </div>
  </div>

<script src="assets/js/config.js?v=4"></script>
