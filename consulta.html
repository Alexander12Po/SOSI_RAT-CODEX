<div class="loader-screen" id="loaderScreen">
  <div class="loader-content">
    <div class="loader-logo">SC</div>

    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <p class="loader-sub">Conectando…</p>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/" class="sidebar-logo">
      <span class="brand-mark">SC</span>
      <span class="sidebar-brand">SOSI<small>Codex</small></span>
    </a>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Cerrar menú">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <div id="accountSidebar"></div>

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      <span>Cifrado AES</span>
    </div>
  </div>
</aside>

<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="menu-btn" aria-label="Volver">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

    </div>
    <div class="topbar-right">
      <div class="status-indicator"><span class="status-dot"></span><span>En línea</span></div>
      <span id="accountSlot"></span>
    </div>
  </header>

  <div class="page-content">
    <div class="consulta-wrap">

      <!-- Barra compacta: icono + input + botón -->
      <div class="search-panel">
        <div class="sp-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg>
        </div>
        <div class="input-group">
          <input type="text" id="dni" placeholder="Ingrese 8 dígitos" maxlength="8" inputmode="numeric" autocomplete="off" aria-label="Número de DNI">
          <button id="btnConsultar" aria-label="Consultar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Buscar</span>
          </button>
        </div>
      </div>
      <p class="field-hint" id="fieldHint">El DNI debe tener 8 dígitos.</p>

      <!-- Aviso / instrucciones -->
      <div id="tipCard"></div>

      <!-- Estado inicial + búsquedas recientes -->
      <section id="idleSection"></section>

      <!-- Resultados -->
      <section id="resultsSection" style="display:none">
        <div class="results-grid" id="resultsContainer"></div>
      </section>

    </div>
  </div>
