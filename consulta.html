<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta DNI — SOSI CODEX</title>
<link rel="stylesheet" href="style.css?v=3">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="consulta-page">

<div class="loader-screen" id="loaderScreen">
  <div class="loader-content">
    <div class="loader-logo">SC</div>
    <h2 class="loader-title">SOSI CODEX</h2>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <p class="loader-sub">Conectando con el servidor…</p>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="index.html" class="sidebar-logo">
      <span class="brand-mark">SC</span>
      <span class="sidebar-brand">SOSI CODEX</span>
    </a>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <span class="nav-section">General</span>
    <a href="index.html" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </a>
    <a href="consulta.html" class="nav-item active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg>
      <span>Consulta DNI</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="security-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      <span>Conexión cifrada</span>
    </div>
  </div>
</aside>

<main class="main-content consulta-main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <span class="topbar-title">Consulta DNI</span>
    </div>
    <div class="topbar-right">
      <div class="status-indicator"><span class="status-dot"></span>En línea</div>
    </div>
  </header>

  <div class="consulta-content">
    <div class="consulta-card">
      <div class="consulta-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg>
      </div>
      <h1>Consulta DNI</h1>
      <p>Ingresa los 8 dígitos del documento.</p>

      <div class="consulta-form">
        <label for="dni">Número de DNI</label>
        <div class="input-group">
          <input type="text" id="dni" placeholder="12345678" maxlength="8" inputmode="numeric" autocomplete="off">
          <button id="btnConsultar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Consultar
          </button>
        </div>
      </div>
    </div>

    <section id="resultsSection" style="display:none">
      <div class="results-container" id="resultsContainer"></div>
    </section>
  </div>
</main>

<script src="script.js?v=3"></script>
</body>
</html>
