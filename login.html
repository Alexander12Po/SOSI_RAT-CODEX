<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SOSI CODEX</title>
    <meta name="description" content="Inicia sesión en tu cuenta de SOSI CODEX.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css?v=20">
    <link rel="stylesheet" href="assets/css/auth.css?v=20">
</head>
<body class="auth-body">

<main class="auth-shell">
    <form class="auth-card" id="loginForm" novalidate>
        <div class="auth-brand">
            <span class="auth-logo"><img src="assets/img/favicon.png" alt="Logo SOSI CODEX"></span>
        </div>
        <h1 class="auth-title">Bienvenido a SOSI CODEX</h1>
        <p class="auth-sub">Inicia sesión para acceder a tu cuenta</p>

        <div class="oauth-grid" id="oauthGrid">
            <button type="button" class="oauth-btn" data-provider="google" aria-label="Continuar con Google">
                <svg width="15" height="15" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.6 2.8c2.2-2 3.8-5 3.8-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.6-2.8c-1 .7-2.3 1.2-4.3 1.2-3.3 0-6-2.2-7-5.1L1.9 17.3C3.8 21.3 7.6 24 12 24z"/><path fill="#FBBC05" d="M5 14.4c-.2-.7-.4-1.5-.4-2.4s.2-1.7.4-2.4L1.9 6.7C1.1 8.3.6 10.1.6 12s.5 3.7 1.3 5.3L5 14.4z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.2-3.1C18 1.1 15.2 0 12 0 7.6 0 3.8 2.7 1.9 6.7L5 9.6c1-2.9 3.7-4.9 7-4.9z"/></svg>
                Google
            </button>
            <button type="button" class="oauth-btn" data-provider="github" aria-label="Continuar con GitHub">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.8 1 .8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
                GitHub
            </button>
            <button type="button" class="oauth-btn" data-provider="discord" aria-label="Continuar con Discord">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5c1.7.4 2.6 1 3.4 1.7a13.3 13.3 0 0 0-11.2 0c.9-.7 1.9-1.4 3.4-1.7L10.6 3a19.8 19.8 0 0 0-5 1.4C2.6 8.8 1.8 13.2 2.2 17.5a19.9 19.9 0 0 0 6 3l.8-1.3c-.7-.2-1.6-.6-2.2-1.1l.5-.4a14.2 14.2 0 0 0 11.3 0l.5.4c-.7.5-1.5.9-2.3 1.1l.8 1.3a19.8 19.8 0 0 0 6.1-3c.5-5-.8-9.3-3.4-13.1zM8.7 14.9c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
                Discord
            </button>
        </div>

        <div class="auth-sep">O continúa con tu correo</div>

        <div class="auth-field">
            <label class="auth-label" for="email">Correo electrónico</label>
            <div class="auth-input-wrap">
                <input class="auth-input" type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
            </div>
        </div>

        <div class="auth-field">
            <label class="auth-label" for="password">Contraseña</label>
            <div class="auth-input-wrap">
                <input class="auth-input has-toggle" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="auth-eye" data-target="password" aria-label="Mostrar contraseña">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <div class="auth-row">
            <label class="auth-check"><input type="checkbox" id="remember" checked> Recordarme</label>
            <a class="auth-link" href="forgot-password.html">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="auth-err" id="loginErr" role="alert"></div>

        <button class="auth-btn auth-btn-primary" type="submit" id="loginBtn">
            <span class="auth-spin"></span>
            <span class="auth-btn-label">Iniciar sesión</span>
        </button>

        <p class="auth-foot">¿No tienes una cuenta? <a class="auth-link" href="register.html">Regístrate</a></p>
    </form>

    <a class="auth-back" id="backLink" href="/consulta.html" style="justify-content:center; margin-top:14px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver al panel
    </a>
</main>

<script src="assets/js/firebase.js?v=21"></script>
<script src="assets/js/config.js?v=21"></script>
<script src="assets/js/auth.js?v=22"></script>
<script src="assets/js/pages/login.js?v=22"></script>
<script>
/* "Volver": al panel si hay sesion, si no se queda en login (acceso obligatorio) */
(function(){
  try{
    var keys=Object.keys(localStorage).filter(k=>k.indexOf("sb-")===0&&k.indexOf("-auth-token")!==-1);
    var ok=false;
    for(const k of keys){ if(/"access_token"\s*:\s*"eyJ/.test(localStorage.getItem(k)||"")){ok=true;break;} }
    if(!ok){ document.getElementById("backLink").style.display="none"; }
  }catch(e){}
})();
</script>
</body>
</html>
